services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urban-scenery-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/urban_ventures.db
      SECRET_KEY: ${SECRET_KEY:-urban-scenery-ventures-docker-secret-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      AUTO_SEED: "true"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      target: runner
    container_name: urban-scenery-frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:

